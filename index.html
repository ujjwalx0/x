<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Question That Matters</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(60% 60% at 20% 10%, #ff4d9d44, transparent),
    radial-gradient(50% 50% at 80% 90%, #7b4dff44, transparent),
    #07070d;
  color:#fff;
  overflow:hidden;
  padding:18px;
}

.card{
  width:100%;
  max-width:430px;
  padding:38px 26px 42px;
  border-radius:36px;
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(28px);
  box-shadow:0 55px 150px rgba(0,0,0,.7);
  text-align:center;
  animation:enter .7s ease;
}

@keyframes enter{
  from{opacity:0;transform:translateY(20px) scale(.96)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 14px;
  font-size:34px;
  font-weight:700;
  background:linear-gradient(135deg,#ffd6eb,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16.6px;
  line-height:1.7;
  opacity:.95;
}

.hero{
  width:100%;
  border-radius:22px;
  margin:18px 0 22px;
}

.question{
  font-size:21px;
  font-weight:600;
  margin:16px 0 8px;
}

.meaning{
  font-size:14.5px;
  opacity:.82;
  margin-bottom:26px;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:17px 0;
  font-size:16.8px;
  border:none;
  border-radius:28px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,#ff2f7d,#ff8fd1);
  color:#fff;
  box-shadow:0 18px 55px rgba(255,47,125,.6);
}

#no{
  background:rgba(255,255,255,.22);
  color:#fff;
  position:relative;
}

.final h1{font-size:44px}
.final p{font-size:18px}

.gif{
  width:100%;
  border-radius:24px;
  margin-top:26px;
}

/* floating dots */
.dot{
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  background:#fff3;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-10vh)}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>

  <p id="intro"></p>

  <img class="hero" id="heroGif" alt="moment">

  <div class="question">
    Do you choose me — not just now, but for the long run?
  </div>

  <div class="meaning">
    Yes = “I want you in my life.”<br>
    No = “I don’t feel that way.”
  </div>

  <div class="btns">
    <button id="yes">Yes, I choose you</button>
    <button id="no">No, I don’t</button>
  </div>
</div>

<script>
/* ========= NAME FROM URL ========= */
const params = new URLSearchParams(location.search);
const raw = params.get("name") || "You";
const name = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();

document.getElementById("name").innerText = name;
document.getElementById("intro").innerHTML =
  `Hey ${name},<br>
   this isn’t about a moment.<br>
   It’s about intention.`;

/* ========= GIF COLLECTIONS ========= */

/* proposal / love (first page) */
let proposalGifs = [
  "https://media.giphy.com/media/xUPGcguWZHRC2HyBRS/giphy.gif",
  "https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif",
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
  "https://media.giphy.com/media/3oriO6qJiXajN0TyDu/giphy.gif",
  "https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif"
];

/* hug / kiss / love (yes page) */
let hugGifs = [
  "https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif",
  "https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif",
  "https://media.giphy.com/media/3oEjI4sFlp73fvEYgw/giphy.gif",
  "https://media.giphy.com/media/HaC1WdpkL3W00/giphy.gif",
  "https://media.giphy.com/media/gnXG2hODaCOru/giphy.gif"
];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* load random proposal gif */
document.getElementById("heroGif").src = pick(proposalGifs);

/* ========= NO BUTTON (PROXIMITY BASED) ========= */
const no = document.getElementById("no");

function near(x,y){
  const r=no.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  return Math.hypot(x-cx,y-cy)<90;
}

function run(){
  const x=Math.random()*260-130;
  const y=Math.random()*180-90;
  no.style.transform=`translate(${x}px,${y}px)`;
}

document.addEventListener("mousemove",e=>{
  if(near(e.clientX,e.clientY)) run();
});

document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(near(t.clientX,t.clientY)) run();
});

/* ========= YES CLICK ========= */
document.getElementById("yes").onclick=()=>{
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>🤍</h1>
      <p>
        ${name},<br><br>
        then come here.<br>
        this hug isn’t loud — it’s real 🤍<br><br>
        let’s stay.
      </p>
      <img class="gif" src="${pick(hugGifs)}">
    </div>
  `;
};

/* ========= FLOATING DOTS ========= */
setInterval(()=>{
  const d=document.createElement("div");
  d.className="dot";
  d.style.left=Math.random()*100+"vw";
  d.style.animationDuration=4+Math.random()*4+"s";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),8000);
},500);
</script>

</body>
</html>
