<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Real Feeling</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}

:root{
  --bg:#0b0b14;
  --card:#151527;
  --primary:#ff5fa2;
  --secondary:#ff9bd5;
  --text:#ffffff;
  --soft:#ffd9ec;
}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(70% 50% at 15% 10%, #ff5fa255, transparent),
    radial-gradient(60% 50% at 85% 90%, #ff9bd555, transparent),
    var(--bg);
  color:var(--text);
  padding:14px;
  overflow:hidden;
}

.card{
  width:100%;
  max-width:380px;
  background:linear-gradient(180deg,#1a1a33,#111125);
  border-radius:30px;
  padding:26px 22px 28px;
  box-shadow:0 35px 120px rgba(0,0,0,.7);
  text-align:center;
}

/* TEXT */
h1{margin:0 0 6px;font-size:30px;color:var(--primary)}
.emojis{font-size:24px;margin:10px 0}
p{font-size:15.6px;line-height:1.65;color:var(--soft)}
.question{font-size:19px;font-weight:600}
.hint{font-size:13.4px;color:#ffc0dd;margin-bottom:16px}

/* BUTTONS */
.btns{display:flex;gap:12px}
button{
  flex:1;
  padding:14px 0;
  font-size:15px;
  border:none;
  border-radius:22px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#2a0014;
  font-weight:600;
}

/* NO — SMALLER + CRAZY FAST */
#no{
  flex:.6;
  font-size:13px;
  background:#1f1f3f;
  color:#fff;
  touch-action:manipulation;
  transition:transform .03s linear;
  will-change:transform;
}

.small{font-size:12px;color:#ffb6d5;margin-top:10px}

/* FINAL */
.final p{font-size:16px;color:#ffe4f1}
textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:12px;
  font-size:14px;
}
.save-btn{
  margin-top:12px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#ff5fa2,#ff9bd5);
  color:#2a0014;
  font-weight:600;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>
  <div class="emojis">💖 💋 🤍 💫</div>
  <p id="intro"></p>

  <div class="question">
    I don’t like you casually.<br>I like you intentionally.
  </div>

  <div class="hint">
    If you feel it too, choose yes.<br>If not, choose no.
  </div>

  <div class="btns">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <div class="small">Honest feelings only.</div>
</div>

<script>
/* ---------------- CONFIG ---------------- */
const BIN_ID = "69809848ae596e708f0b60cd";
const API_KEY = "$2a$10$SWRs0c4zsOCWZY5mPavGI.CFoLPsZilAUB1XKFEUU7r0kcOJ9jPSC";
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

/* ---------------- NAME ---------------- */
const params = new URLSearchParams(location.search);
const raw = params.get("query") || "You";
const name = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();

document.getElementById("name").innerText = name;
document.getElementById("intro").innerHTML =
  `Hey ${name},<br>this moment is real and from the heart.`;

/* ---------------- HELPERS ---------------- */
const sessionId = sessionStorage.getItem("sid") || crypto.randomUUID();
sessionStorage.setItem("sid", sessionId);

function getDevice(){
  return {
    ua: navigator.userAgent,
    platform: navigator.platform,
    screen: `${screen.width}x${screen.height}`,
    lang: navigator.language
  };
}

async function getData(){
  const r = await fetch(BASE_URL,{headers:{"X-Access-Key":API_KEY}});
  return (await r.json()).record;
}

async function saveResponse(choice,message=""){
  const data = await getData();
  data.responses.push({
    name,
    choice,
    message,
    sessionId,
    device:getDevice(),
    time:new Date().toISOString()
  });

  await fetch(BASE_URL,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Access-Key":API_KEY
    },
    body:JSON.stringify(data)
  });

  localStorage.setItem("answered_"+name,"true");
}

/* ---------------- EXISTING RESPONSE CHECK ---------------- */
(async ()=>{
  const data = await getData();
  const last = data.responses.reverse().find(r=>r.name===name);
  if(last){
    showFinal(last.choice,last.message);
  }
})();

/* ---------------- NO BUTTON DODGE ---------------- */
const no=document.getElementById("no");
document.addEventListener("mousemove",e=>dodge(e.clientX,e.clientY));
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  dodge(t.clientX,t.clientY);
},{passive:true});

function dodge(x,y){
  const r=no.getBoundingClientRect();
  if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<70){
    no.style.transform=`translate(${Math.random()*220-110}px,${Math.random()*160-80}px)`;
  }
}

/* ---------------- YES / NO ---------------- */
document.getElementById("yes").onclick=()=>{
  showReplyBox();
};

document.getElementById("no").onclick=()=>{
  saveResponse("NO");
  showFinal("NO","");
};

function showReplyBox(){
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>💖</h1>
      <p>${name}, this made me smile.</p>
      <textarea id="reply" placeholder="Say something..."></textarea>
      <button class="save-btn" id="save">Save my response</button>
    </div>
  `;
  document.getElementById("save").onclick=()=>{
    const msg=document.getElementById("reply").value.trim();
    saveResponse("YES",msg);
    showFinal("YES",msg);
  };
}

function showFinal(choice,msg){
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>${choice==="YES"?"💖":"🤍"}</h1>
      <p>
        You chose <b>${choice}</b><br><br>
        ${msg || "Thank you for being honest."}
      </p>
    </div>
  `;
}
</script>

</body>
</html>
