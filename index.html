<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ff6a88, #ff99ac);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    padding: 16px;
  }

  /* floating hearts */
  .heart {
    position: absolute;
    font-size: 18px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(110vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: rgba(255,255,255,0.98);
    border-radius: 24px;
    padding: 28px 22px 32px;
    text-align: center;
    box-shadow: 0 28px 60px rgba(0,0,0,0.25);
    animation: pop 0.7s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    margin: 0 0 14px;
    font-size: 26px;
    color: #ff2f68;
    font-weight: 700;
  }

  p {
    font-size: 16.5px;
    color: #333;
    line-height: 1.55;
    margin-bottom: 24px;
  }

  .question {
    font-size: 18px;
    font-weight: 600;
    color: #ff2f68;
    margin-bottom: 26px;
  }

  .btns {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  button {
    flex: 1;
    padding: 14px 0;
    font-size: 17px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  #yes {
    background: linear-gradient(135deg, #ff2f68, #ff8fb1);
    color: white;
    box-shadow: 0 10px 25px rgba(255,47,104,0.4);
  }

  #no {
    background: #e8e8e8;
    color: #555;
    position: relative;
  }

  .final h1 {
    font-size: 28px;
    margin-bottom: 14px;
  }

  .final p {
    font-size: 18px;
    color: #ff2f68;
    line-height: 1.6;
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Nilisha</h1>

  <p>
    I like the way things feel when you are around.  
    It is calm, easy, and real.  
    That matters to me.
  </p>

  <div class="question">
    Would you like to be with me?
  </div>

  <div class="btns">
    <button id="yes">Yes 🙂</button>
    <button id="no">No 😌</button>
  </div>
</div>

<script>
  const card = document.getElementById("card");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  // playful NO movement but stays visible
  function moveNo() {
    noBtn.style.transform = "translateX(" + (Math.random() * 40 - 20) + "px)";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  yesBtn.addEventListener("click", () => {
    card.innerHTML = `
      <div class="final">
        <h1>❤️</h1>
        <p>
          That means a lot to me, Nilisha.  
          Truly. 😊<br><br>
          I am really happy you said yes.  
          Let us take this one step at a time,  
          together 💫
        </p>
      </div>
    `;
  });

  // floating hearts effect
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = "❤️";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 7000);
  }, 500);
</script>

</body>
</html>
