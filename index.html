<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>This Moment</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{ -webkit-tap-highlight-color:transparent }

/* ===== CINEMATIC EFFECTS ===== */
@keyframes rise {
  from{opacity:0; transform:translateY(30px)}
  to{opacity:1; transform:none}
}
@keyframes glow {
  0%,100%{ box-shadow:0 0 30px rgba(255,120,160,.25) }
  50%{ box-shadow:0 0 80px rgba(255,120,160,.45) }
}
@keyframes float {
  0%,100%{ transform:translateY(0) }
  50%{ transform:translateY(-14px) }
}
@keyframes heartPop {
  from{ transform:scale(.3); opacity:1 }
  to{ transform:scale(2); opacity:0 }
}

.fade{ animation:rise .9s ease forwards }
.glow{ animation:glow 6s ease-in-out infinite }
.float{ animation:float 7s ease-in-out infinite }

.heart{
  position:fixed;
  font-size:24px;
  animation:heartPop 1.1s ease forwards;
  pointer-events:none;
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-neutral-50 via-rose-50 to-white flex items-center justify-center overflow-hidden">

<!-- ambient -->
<div class="absolute -top-40 -left-40 w-[420px] h-[420px] bg-rose-200/40 blur-3xl rounded-full float"></div>
<div class="absolute -bottom-40 -right-40 w-[420px] h-[420px] bg-pink-200/40 blur-3xl rounded-full float"></div>

<!-- audio -->
<audio id="bgMusic" loop muted>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_8c3a8f2f98.mp3">
</audio>

<!-- APP -->
<div class="relative z-10 w-full max-w-md mx-auto px-4">
  <div id="card"
    class="bg-white/85 backdrop-blur-xl rounded-[30px] p-8 text-center glow fade">
  </div>
</div>

<!-- MODAL -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/50 z-40 px-4">
  <div class="bg-white rounded-[26px] p-6 w-full max-w-md fade">
    <h2 class="text-xl font-semibold text-gray-800 text-center">
      Say it honestly
    </h2>

    <p class="mt-3 text-sm text-gray-500 text-center leading-relaxed">
      No pressure. No performance. Just what you feel.
    </p>

    <div class="mt-4 bg-neutral-100 rounded-2xl p-4">
      <textarea id="reply"
        class="w-full bg-transparent outline-none resize-none text-sm"
        rows="4"
        placeholder="Write what feels right…"></textarea>
    </div>

    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-rose-400 to-pink-500 text-white font-semibold shadow-md active:scale-95">
      Save this moment
    </button>
  </div>
</div>

<script>
/* ========= CONFIG ========= */
const BIN_ID="69809848ae596e708f0b60cd";
const API_KEY="$2a$10$SWRs0c4zsOCWZY5mPavGI.CFoLPsZilAUB1XKFEUU7r0kcOJ9jPSC";
const BASE_URL=`https://api.jsonbin.io/v3/b/${BIN_ID}`;

/* ========= PARAMS ========= */
const p=new URLSearchParams(location.search);
const isAdmin=p.get("admin")==="1";
const name=(p.get("query")||"You").replace(/^\w/,c=>c.toUpperCase());

/* ========= DEVICE ========= */
let deviceId=localStorage.getItem("device_id");
if(!deviceId){
  deviceId=crypto.randomUUID();
  localStorage.setItem("device_id",deviceId);
}

/* ========= AUDIO ========= */
const music=document.getElementById("bgMusic");
function startMusic(){
  music.muted=false;
  music.volume=0;
  music.play();
  let v=0;
  const i=setInterval(()=>{
    v+=0.04;
    music.volume=Math.min(v,0.6);
    if(v>=0.6) clearInterval(i);
  },200);
}
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

/* ========= JSONBIN ========= */
async function getData(){
  const r=await fetch(BASE_URL,{headers:{ "X-Access-Key":API_KEY }});
  return (await r.json()).record;
}
async function saveYes(message){
  const data=await getData();
  data.responses.push({name,deviceId,message,time:new Date().toISOString()});
  await fetch(BASE_URL,{
    method:"PUT",
    headers:{ "Content-Type":"application/json","X-Access-Key":API_KEY },
    body:JSON.stringify(data)
  });
}

/* ========= PROPOSALS ========= */
const proposals=[
"{Name}, I won’t pretend to have everything figured out. But I know I want you with me. Will you be mine?",
"{Name}, this isn’t a casual question. I’m asking with intention. Will you be with me?",
"{Name}, I don’t want to rush this. I just want to choose you. Will you choose me too?",
"{Name}, I’m not here for something temporary. I want something real. Will you be mine?",
"{Name}, I don’t promise perfection. I promise honesty. Will you stay with me?",
"{Name}, this is about choice. And I choose you. Will you be mine?",
"{Name}, I respect you enough to ask clearly. Will you be with me?",
"{Name}, I know what I feel. And I want you. Will you be mine?",
"{Name}, this question matters to me. Will you be with me?",
"{Name}, I believe in choosing people. And I choose you. Will you be mine?",
"{Name}, I’m not asking for forever today. I’m asking for us. Will you be with me?",
"{Name}, I want to build something meaningful. With you. Will you be mine?",
"{Name}, I’m serious about this question because I’m serious about you. Will you be with me?",
"{Name}, I don’t want to regret not asking. So here it is. Will you be mine?",
"{Name}, I want to choose you every day. Will you be with me?",
"{Name}, I don’t want a perfect story. I want a real one. Will you be mine?",
"{Name}, I respect you too much to play games. Will you be with me?",
"{Name}, this isn’t dramatic. It’s sincere. Will you be mine?",
"{Name}, I’m ready to show up and care. Will you be with me?",
"{Name}, I don’t want to wonder. I want to know. Will you be mine?",
"{Name}, I choose clarity over hesitation. I want you. Will you be with me?",
"{Name}, I want something meaningful, not temporary. Will you be mine?",
"{Name}, this question comes from respect. Will you be with me?",
"{Name}, I’m asking because I mean it. Will you be mine?",
"{Name}, I’m not asking you to promise anything. Just to choose me. Will you be with me?"
];

function getRandomProposal(){
  return proposals[Math.floor(Math.random()*proposals.length)]
    .replace("{Name}",name);
}

/* ========= UI ========= */
const card=document.getElementById("card");
const modal=document.getElementById("modal");

/* ========= ADMIN VIEW ========= */
function renderAdmin(responses){
  card.innerHTML=`
  <h1 class="text-2xl font-semibold mb-4">Admin Panel</h1>
  <div class="space-y-3 max-h-[65vh] overflow-y-auto text-left">
    ${responses.map(r=>`
      <div class="p-4 bg-rose-50 rounded-xl">
        <p class="text-sm font-semibold">${r.name}</p>
        <p class="text-sm italic mt-1">"${r.message}"</p>
        <p class="text-[11px] text-gray-400 mt-1">${new Date(r.time).toLocaleString()}</p>
      </div>
    `).join("")}
  </div>
  `;
}

/* ========= MAIN ========= */
function renderStart(){
const proposal=getRandomProposal();
card.innerHTML=`
<h1 class="text-3xl font-semibold">${name}</h1>

<img class="mt-5 rounded-2xl shadow-md mx-auto"
 src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" />

<p class="mt-6 text-lg">${proposal}</p>

<div class="mt-8 flex justify-center gap-4">
<button id="yes"
 class="px-7 py-3 rounded-full bg-gradient-to-r from-rose-400 to-pink-500 text-white shadow-lg">
Yes
</button>
<button id="no"
 class="px-4 py-2 rounded-full bg-gray-200 text-xs">
No
</button>
</div>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️
</footer>
`;

document.getElementById("yes").onclick=()=>{
burst();
modal.classList.remove("hidden");
modal.classList.add("flex");
};
}

function renderFinal(msg){
card.innerHTML=`
<h1 class="text-3xl">✨</h1>
<p class="mt-6 text-lg">You chose this moment.</p>
<blockquote class="mt-6 italic border-l-4 border-rose-400 pl-4">
"${msg}"
</blockquote>
<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️
</footer>
`;
}

/* ========= SAVE ========= */
document.getElementById("save").onclick=async()=>{
  const msg=document.getElementById("reply").value.trim();
  if(!msg) return;
  await saveYes(msg);
  modal.classList.add("hidden");
  renderFinal(msg);
};

/* ========= HEARTS ========= */
function burst(){
  for(let i=0;i<20;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.top=Math.random()*100+"vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
  }
}

/* ========= INIT ========= */
(async()=>{
  const data=await getData();

  if(isAdmin){
    const pwd=prompt("Enter admin password");
    if(pwd==="mild"){
      renderAdmin(data.responses);
    }else{
      card.innerHTML="<p class='text-red-500'>Access denied</p>";
    }
    return;
  }

  const existing=[...data.responses].reverse()
    .find(r=>r.name===name && r.deviceId===deviceId);

  if(existing){
    renderFinal(existing.message);
  }else{
    renderStart();
  }
})();
</script>

</body>
</html>
