<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One Real Feeling</title>

<!-- TAILWIND CDN -->
<script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-500/30 via-purple-500/20 to-black text-white">

<div id="card" class="w-full max-w-md mx-4 rounded-3xl bg-white/10 backdrop-blur-xl p-6 shadow-2xl text-center">
</div>

<script>
/* ---------------- CONFIG ---------------- */
const BIN_ID = "69809848ae596e708f0b60cd";
const API_KEY = "$2a$10$SWRs0c4zsOCWZY5mPavGI.CFoLPsZilAUB1XKFEUU7r0kcOJ9jPSC";
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

/* ---------------- NAME ---------------- */
const params = new URLSearchParams(location.search);
const raw = params.get("query") || "You";
const name = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();

/* ---------------- STATE ---------------- */
const answeredKey = "answered_" + name;
const canEdit = sessionStorage.getItem("can_edit_" + name);

/* ---------------- HELPERS ---------------- */
async function getData(){
  const r = await fetch(BASE_URL,{headers:{ "X-Access-Key":API_KEY }});
  return (await r.json()).record;
}

async function saveResponse(choice,message=""){
  const data = await getData();
  data.responses.push({
    name,
    choice,
    message,
    time:new Date().toISOString()
  });
  await fetch(BASE_URL,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Access-Key":API_KEY
    },
    body:JSON.stringify(data)
  });

  localStorage.setItem(answeredKey,"true");
  sessionStorage.setItem("can_edit_" + name,"false");
}

/* ---------------- RENDER FUNCTIONS ---------------- */
function renderQuestion(){
  card.innerHTML = `
    <h1 class="text-3xl font-bold text-pink-400">${name}</h1>
    <p class="mt-4 text-pink-100 text-lg leading-relaxed">
      This isn’t casual.<br>
      This is something I feel clearly.
    </p>

    <p class="mt-6 text-xl font-semibold">
      Do you feel it too?
    </p>

    <div class="mt-6 flex gap-3">
      <button id="yes" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-rose-400 text-black font-semibold">
        Yes
      </button>
      <button id="no" class="flex-[0.6] py-3 rounded-xl bg-white/20 text-white">
        No
      </button>
    </div>

    <p class="mt-4 text-sm text-pink-200">
      Take your time. Be honest.
    </p>
  `;

  document.getElementById("yes").onclick = ()=>{
    sessionStorage.setItem("can_edit_" + name,"true");
    renderReply();
  };

  document.getElementById("no").onclick = ()=>{
    saveResponse("NO","");
    renderFinal("NO","");
  };
}

function renderReply(){
  card.innerHTML = `
    <h1 class="text-3xl font-bold text-pink-400">💖</h1>
    <p class="mt-4 text-lg text-pink-100">
      That means something to me, ${name}.<br>
      If you want, say something back.
    </p>

    <textarea id="reply"
      class="mt-4 w-full rounded-xl p-3 text-black"
      placeholder="Write whatever you feel…"></textarea>

    <button id="save"
      class="mt-4 w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-rose-400 text-black font-semibold">
      Save my response
    </button>
  `;

  document.getElementById("save").onclick = ()=>{
    const msg = document.getElementById("reply").value.trim();
    saveResponse("YES",msg);
    renderFinal("YES",msg);
  };
}

function renderFinal(choice,msg){
  card.innerHTML = `
    <h1 class="text-3xl">${choice==="YES"?"💖":"🤍"}</h1>
    <p class="mt-4 text-lg text-pink-100">
      ${choice==="YES"
        ? `You said yes, ${name}.<br>That made me really happy.`
        : `Thank you for being honest, ${name}.`}
    </p>

    ${msg ? `<p class="mt-4 italic text-pink-200">"${msg}"</p>` : ""}

    ${choice==="YES"
      ? `<img class="mt-6 rounded-2xl shadow-xl"
         src="https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif">`
      : ""}
  `;
}

/* ---------------- INIT ---------------- */
(async ()=>{
  const data = await getData();
  const last = [...data.responses].reverse().find(r=>r.name===name);

  if(last && !canEdit){
    renderFinal(last.choice,last.message);
  } else {
    renderQuestion();
  }
})();
</script>

</body>
</html>
