<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Real Moment 💖</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
* { -webkit-tap-highlight-color: transparent }

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px) scale(.98) }
  to { opacity:1; transform:none }
}
@keyframes zoomIn {
  from { transform: scale(1.4); opacity:0 }
  to { transform: scale(1); opacity:1 }
}
@keyframes glow {
  0%,100% { box-shadow:0 0 40px rgba(255,105,180,.35) }
  50% { box-shadow:0 0 90px rgba(255,105,180,.6) }
}
@keyframes pulse {
  0%,100% { opacity:.6 }
  50% { opacity:1 }
}
@keyframes heartPop {
  from { transform: scale(.4); opacity:1 }
  to { transform: scale(2); opacity:0 }
}
@keyframes float {
  0%,100% { transform: translateY(0) }
  50% { transform: translateY(-14px) }
}

/* ===== CLASSES ===== */
.fade { animation: fadeUp .7s ease forwards }
.intro { animation: zoomIn .9s ease forwards }
.glow { animation: glow 5s ease-in-out infinite }
.pulse { animation: pulse 6s ease-in-out infinite }
.float { animation: float 6s ease-in-out infinite }

.heart {
  position: fixed;
  font-size: 26px;
  animation: heartPop 1.1s ease forwards;
  pointer-events:none;
}

/* ===== COUNTDOWN ===== */
#countdown {
  font-size: 4rem;
  font-weight: 700;
  color: #ec4899;
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-100 to-white flex items-center justify-center overflow-hidden">

<!-- Background pulse -->
<div class="absolute inset-0 bg-gradient-to-br from-pink-200/40 to-rose-200/30 pulse"></div>

<!-- Romantic Music -->
<audio id="bgMusic" loop muted>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_8c3a8f2f98.mp3" type="audio/mpeg">
</audio>

<!-- COUNTDOWN SCREEN -->
<div id="countScreen"
 class="absolute inset-0 flex items-center justify-center z-20">
  <div id="countdown" class="fade">3</div>
</div>

<!-- APP -->
<div id="app"
 class="relative z-10 w-full max-w-md mx-auto px-4 hidden">
  <div id="card"
   class="bg-white/85 backdrop-blur-xl rounded-3xl p-7 text-center glow intro">
  </div>
</div>

<!-- MODAL -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50 px-4">
  <div class="bg-white rounded-3xl p-6 w-full max-w-md text-center fade">
    <h2 class="text-2xl font-semibold text-pink-500">A quiet truth 💌</h2>

    <p class="mt-3 text-gray-600 text-sm leading-relaxed">
      This space is just for you.<br>
      No labels. No pressure. Just honesty.
    </p>

    <div class="mt-4 bg-pink-50 rounded-2xl p-4">
      <textarea id="reply"
        class="w-full bg-transparent outline-none text-sm resize-none"
        rows="4"
        placeholder="Write what feels real… ✨"></textarea>
    </div>

    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-semibold shadow-md active:scale-95 transition">
      Keep this moment 💖
    </button>
  </div>
</div>

<script>
/* ===== MUSIC ===== */
const music=document.getElementById("bgMusic");
function startMusic(){
  music.muted=false;
  music.volume=0;
  music.play();
  let v=0;
  const fade=setInterval(()=>{
    v+=0.04;
    music.volume=Math.min(v,0.6);
    if(v>=0.6) clearInterval(fade);
  },200);
}
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

/* ===== NAME ===== */
const q=new URLSearchParams(location.search);
const name=(q.get("query")||"You").replace(/^\w/,c=>c.toUpperCase());

const card=document.getElementById("card");
const modal=document.getElementById("modal");

/* ===== MAIN SCREEN ===== */
function start(){
card.innerHTML=`
<h1 class="text-3xl font-semibold text-gray-800">${name} 🌸</h1>

<p class="mt-4 text-gray-700 text-lg leading-relaxed">
Some connections don’t demand answers.<br>
They simply feel right… quietly ✨
</p>

<p class="mt-6 text-xl font-medium text-gray-900">
If I asked you to choose this moment with me 💖
</p>

<p class="mt-2 text-sm text-gray-600">
what would you feel?
</p>

<div class="mt-7 flex justify-center gap-3">
<button id="yes"
 class="px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-400 to-rose-500 text-white text-sm font-semibold shadow-md active:scale-95">
Yes 💕
</button>

<button id="no"
 class="px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-xs">
No 🙈
</button>
</div>

<p class="mt-5 text-xs text-gray-500">
This moment is safe 🤍
</p>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;

document.getElementById("yes").onclick=()=>{
burst();
modal.classList.remove("hidden");
modal.classList.add("flex");
};
}

/* ===== FINAL ===== */
function final(msg){
card.innerHTML=`
<h1 class="text-4xl">💖✨💖</h1>

<p class="mt-4 text-lg text-gray-800">
You chose this moment.<br>
And that choice matters.
</p>

<blockquote class="mt-6 italic text-gray-700 border-l-4 border-pink-400 pl-4">
"${msg}"
</blockquote>

<img
 class="mt-8 rounded-2xl shadow-xl mx-auto float"
 src="https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif"
/>

<p class="mt-6 text-sm text-gray-500">
Some feelings don’t fade.<br>
They stay. 💞
</p>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;
}

/* ===== SAVE ===== */
document.getElementById("save").onclick=()=>{
const msg=document.getElementById("reply").value.trim();
if(!msg) return;
modal.classList.add("hidden");
final(msg);
};

/* ===== HEARTS ===== */
function burst(){
for(let i=0;i<26;i++){
const h=document.createElement("div");
h.className="heart";
h.innerText="💖";
h.style.left=Math.random()*100+"vw";
h.style.top=Math.random()*100+"vh";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1100);
}
}

/* ===== NO RUN ===== */
document.addEventListener("mousemove",e=>run(e.clientX,e.clientY));
document.addEventListener("touchmove",e=>{
const t=e.touches[0]; run(t.clientX,t.clientY);
},{passive:true});

function run(x,y){
const no=document.getElementById("no");
if(!no) return;
const r=no.getBoundingClientRect();
if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<80){
no.style.transform=`translate(${Math.random()*160-80}px,${Math.random()*120-60}px)`;
}
}

/* ===== COUNTDOWN ===== */
let count=3;
const cEl=document.getElementById("countdown");
const screen=document.getElementById("countScreen");
const app=document.getElementById("app");

const timer=setInterval(()=>{
count--;
if(count>0){
  cEl.innerText=count;
}else{
  clearInterval(timer);
  screen.classList.add("hidden");
  app.classList.remove("hidden");
  start();
}
},1000);
</script>

</body>
</html>
