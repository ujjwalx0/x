<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💘</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #ffb6c1, #ff4d6d);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    padding: 15px;
  }

  /* floating hearts */
  .heart {
    position: absolute;
    font-size: 18px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh) scale(1); opacity: 1; }
    to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  .card {
    background: rgba(255,255,255,0.97);
    padding: 30px 25px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 360px;
    animation: pop 0.8s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #ff2f68;
    margin-bottom: 25px;
    font-size: 26px;
  }

  .btns {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }

  button {
    padding: 14px 26px;
    font-size: 18px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s ease;
    min-width: 120px;
  }

  button:active {
    transform: scale(0.95);
  }

  #yes {
    background: linear-gradient(135deg, #ff4d6d, #ff85a2);
    color: white;
  }

  #no {
    background: #e0e0e0;
    position: fixed;
    z-index: 3;
  }

  .final {
    animation: pop 0.6s ease;
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Will you be my Valentine? 💖</h1>
  <div class="btns">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙃</button>
  </div>
</div>

<script>
  const card = document.getElementById("card");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  function moveNo() {
    const padding = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  // Mobile + desktop support
  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  yesBtn.addEventListener("click", () => {
    card.innerHTML = `
      <div class="final">
        <h1>Yaaayyy 🥹💖</h1>
        <p style="font-size:20px;color:#ff2f68; line-height:1.5;">
          I knew it 😘<br><br>
          You just made my heart yours forever ❤️🌹<br><br>
          Happy Valentine’s Day 💕
        </p>
      </div>
    `;
  });

  // floating hearts (lightweight)
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 500);
</script>

</body>
</html>
