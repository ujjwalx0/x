<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ff6a88, #ff99ac);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    padding: 16px;
  }

  /* soft floating lights */
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    animation: rise 6s linear infinite;
    pointer-events: none;
  }

  @keyframes rise {
    from { transform: translateY(110vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: rgba(255,255,255,0.97);
    border-radius: 26px;
    padding: 28px 24px 32px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: pop 0.8s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    margin: 0 0 16px;
    font-size: 26px;
    color: #ff2f68;
    font-weight: 700;
  }

  p {
    font-size: 16.5px;
    color: #444;
    line-height: 1.55;
    margin-bottom: 26px;
  }

  .btns {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    min-width: 130px;
    padding: 14px 26px;
    font-size: 17px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  #yes {
    background: linear-gradient(135deg, #ff2f68, #ff8fb1);
    color: white;
    box-shadow: 0 10px 25px rgba(255,47,104,0.4);
  }

  #no {
    background: #e7e7e7;
    color: #555;
    position: fixed;
    z-index: 5;
  }

  .final h1 {
    font-size: 28px;
    margin-bottom: 14px;
  }

  .final p {
    font-size: 18.5px;
    color: #ff2f68;
    line-height: 1.6;
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Nilisha ✨</h1>
  <p>
    I’ll keep this simple and honest.<br><br>
    Life feels better when you’re around,<br>
    and I don’t want to imagine it without you.<br><br>
    So here’s my question —
  </p>

  <div class="btns">
    <button id="yes">Yes 🙂</button>
    <button id="no">No 😌</button>
  </div>
</div>

<script>
  const card = document.getElementById("card");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  function moveNo() {
    const pad = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - pad;
    const maxY = window.innerHeight - noBtn.offsetHeight - pad;
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  yesBtn.addEventListener("click", () => {
    card.innerHTML = `
      <div class="final">
        <h1>🥹❤️</h1>
        <p>
          Nilisha…<br><br>
          that “yes” means more to me than you know ✨<br><br>
          I promise respect, laughter,<br>
          and a whole lot of care 😌💫<br><br>
          Whatever comes next —<br>
          I want it with you. ❤️🤞
        </p>
      </div>
    `;
  });

  /* subtle background sparks */
  setInterval(() => {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 7000);
  }, 450);
</script>

</body>
</html>
