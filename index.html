<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Poppins",system-ui;
  background:
    radial-gradient(circle at top left,#ff4f9a,transparent 40%),
    radial-gradient(circle at bottom right,#7b2cff,transparent 45%),
    #0b0b14;
  overflow:hidden;
  padding:16px;
}

/* floating emojis */
.emoji{
  position:absolute;
  font-size:22px;
  animation:float 7s linear infinite;
  pointer-events:none;
}

@keyframes float{
  from{transform:translateY(110vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}

.card{
  width:100%;
  max-width:390px;
  padding:30px 24px 34px;
  border-radius:28px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  box-shadow:0 35px 90px rgba(0,0,0,.45);
  color:#fff;
  text-align:center;
  animation:pop .7s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  margin:0 0 14px;
  font-size:32px;
  font-weight:700;
  background:linear-gradient(135deg,#ff9bd5,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16.5px;
  line-height:1.65;
  opacity:.95;
}

.question{
  margin:26px 0;
  font-size:19px;
  font-weight:600;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:15px 0;
  font-size:17px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  transition:.15s ease;
}

button:active{transform:scale(.94)}

#yes{
  background:linear-gradient(135deg,#ff3b7f,#ff92d0);
  color:#fff;
  box-shadow:0 14px 35px rgba(255,59,127,.5);
}

#no{
  background:rgba(255,255,255,.25);
  color:#fff;
  position:relative;
}

.final h1{
  font-size:44px;
}

.final p{
  font-size:18px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name">Nilisha</h1>

  <p>
    When you are around,<br>
    everything feels calmer and more real ✨
  </p>

  <div class="question">
    Would you like to be with me? 💫
  </div>

  <div class="btns">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
/* ===== DATA ARRAY (ONLY NILISHA) ===== */
const girls = {
  ns: { name: "Nilisha" }
};

/* ===== URL NAME LOAD ===== */
const params = new URLSearchParams(window.location.search);
const key = params.get("k");
const girlName = girls[key]?.name || "Nilisha";
document.getElementById("name").innerText = girlName;

/* ===== NO BUTTON RUN AWAY ===== */
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const card = document.getElementById("card");

function runAway(){
  const x = Math.random()*260 - 130;
  const y = Math.random()*180 - 90;
  noBtn.style.transform = `translate(${x}px,${y}px)`;
}

noBtn.addEventListener("mouseenter", runAway);
noBtn.addEventListener("touchstart", runAway);

/* ===== YES CLICK ===== */
yesBtn.addEventListener("click", ()=>{
  card.innerHTML = `
    <div class="final">
      <h1>💖</h1>
      <p>
        Nilisha,<br><br>
        Your yes means more than you know 😭✨<br><br>
        This is the start of something beautiful 💫
      </p>
    </div>
  `;
});

/* ===== FLOATING EMOJIS ===== */
const emojis = ["💖","✨","💘","😍","💫"];
setInterval(()=>{
  const e=document.createElement("div");
  e.className="emoji";
  e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=4+Math.random()*4+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),8000);
},450);
</script>

</body>
</html>
