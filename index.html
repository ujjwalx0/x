<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>This Moment</title>

<!-- 🔥 FAVICON (Browser Tab Icon) -->
<link rel="icon" type="image/svg+xml"
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">

<!-- Optional: iOS Home Screen Icon -->
<link rel="apple-touch-icon"
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-neutral-50 via-rose-50 to-white flex items-center justify-center overflow-hidden">

<!-- ambient glow -->
<div class="absolute -top-40 -left-40 w-[420px] h-[420px] bg-rose-200/40 blur-3xl rounded-full animate-pulse"></div>
<div class="absolute -bottom-40 -right-40 w-[420px] h-[420px] bg-pink-200/40 blur-3xl rounded-full animate-pulse"></div>

<!-- background music -->
<audio id="bgMusic" loop muted>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_8c3a8f2f98.mp3">
</audio>

<!-- APP -->
<div class="relative z-10 w-full max-w-md mx-auto px-4">
  <div id="card"
    class="bg-white/85 backdrop-blur-xl rounded-[30px] p-8 text-center shadow-xl">

    <!-- 💗 TOP ICON (Visible Immediately) -->
    <div class="flex justify-center mb-3">
      <span class="text-4xl animate-pulse">💗</span>
    </div>

    <!-- Content injected by JS -->
  </div>
</div>

<!-- MODAL -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/50 z-40 px-4">
  <div class="bg-white rounded-[26px] p-6 w-full max-w-md">
    <h2 class="text-xl font-semibold text-gray-800 text-center">
      Say it honestly
    </h2>

    <p class="mt-3 text-sm text-gray-500 text-center">
      This answer matters.
    </p>

    <textarea id="reply"
      class="mt-4 w-full bg-neutral-100 rounded-xl p-3 outline-none resize-none text-sm"
      rows="4"
      placeholder="Write what you truly feel…"></textarea>

    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-rose-400 to-pink-500 text-white font-semibold">
      Save
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
