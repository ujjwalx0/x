<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>A Simple Choice</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#0b0b14;
  --card:#14142b;
  --accent:#ff4f9a;
  --accent2:#ff8fd1;
  --text:#ffffff;
  --muted:#ffd6eb;
}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(60% 40% at 20% 10%, #ff4f9a66, transparent),
    radial-gradient(60% 40% at 80% 90%, #ff8fd166, transparent),
    var(--bg);
  color:var(--text);
  padding:14px;
  overflow:hidden;
}

.card{
  width:100%;
  max-width:380px;
  background:linear-gradient(180deg,#1a1a38,#11112b);
  border-radius:26px;
  padding:24px 20px 26px;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
  text-align:center;
  animation:fadeUp .7s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px) scale(.97)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 6px;
  font-size:28px;
  font-weight:700;
  color:var(--accent);
}

.emojis{
  font-size:22px;
  margin:10px 0 8px;
}

p{
  font-size:15.4px;
  line-height:1.6;
  color:var(--muted);
  margin:0 0 12px;
}

.question{
  font-size:18.5px;
  font-weight:600;
  color:#fff;
  margin:10px 0 6px;
}

.hint{
  font-size:13.5px;
  color:#ffc0dd;
  margin-bottom:18px;
}

.btns{
  display:flex;
  gap:12px;
}

button{
  flex:1;
  padding:14px 0;
  font-size:15.5px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  transition:transform .12s ease;
}

button:active{transform:scale(.95)}

#yes{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#14000b;
  font-weight:600;
}

#no{
  background:#1f1f44;
  color:#fff;
  position:relative;
}

.small{
  margin-top:10px;
  font-size:12.8px;
  color:#ffb6d5;
}

/* AFTER YES */
.final h1{
  font-size:32px;
  color:var(--accent);
}
.final p{
  font-size:15.8px;
  color:#ffe4f1;
}
.gif{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:18px;
  margin-top:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* Love particles */
.spark{
  position:absolute;
  font-size:22px;
  animation:rise 2.2s ease forwards;
  pointer-events:none;
}
@keyframes rise{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-140px);opacity:0}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>

  <div class="emojis">💖 💋 🤍 💫</div>

  <p id="intro"></p>

  <div class="question">
    I like you, honestly and deeply.
  </div>

  <div class="hint">
    If you feel the same, choose yes.
    If not, choose no.
  </div>

  <div class="btns">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <div class="small">
    Just a real feeling. Nothing forced.
  </div>
</div>

<script>
/* NAME */
const params=new URLSearchParams(location.search);
const raw=params.get("query")||"You";
const name=raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();

document.getElementById("name").innerText=name;
document.getElementById("intro").innerHTML=
  `Hey ${name}, this made its way from the heart.`;

/* NO BUTTON – VERY FAST (MOBILE) */
const no=document.getElementById("no");

function near(x,y){
  const r=no.getBoundingClientRect();
  return Math.hypot(
    x-(r.left+r.width/2),
    y-(r.top+r.height/2)
  ) < 55;
}

function dodge(){
  no.style.transition="transform .06s linear";
  no.style.transform=
    `translate(${Math.random()*260-130}px,${Math.random()*180-90}px)`;
}

document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(near(t.clientX,t.clientY)) dodge();
},{passive:true});

document.addEventListener("mousemove",e=>{
  if(near(e.clientX,e.clientY)) dodge();
});

/* YES – LOVE CELEBRATION + FINAL GIF */
const loveGifs=[
 "https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif",
 "https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif",
 "https://media.giphy.com/media/HaC1WdpkL3W00/giphy.gif",
 "https://media.giphy.com/media/gnXG2hODaCOru/giphy.gif"
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

document.getElementById("yes").onclick=()=>{
  celebrate();
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>That made me really happy 💖</h1>
      <p>
        ${name}, this feels warm, exciting,
        and something worth holding on to.
      </p>
      <img class="gif" src="${pick(loveGifs)}">
    </div>
  `;
};

function celebrate(){
  const icons=["💖","💋","😘","😍","🤍","💫"];
  for(let i=0;i<20;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.innerText=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.bottom="18vh";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2200);
  }
}
</script>

</body>
</html>
