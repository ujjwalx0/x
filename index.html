<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You 💖</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ff758c, #ff7eb3);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    padding: 16px;
  }

  /* floating glow dots */
  .glow {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    animation: float 6s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    from { transform: translateY(110vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: rgba(255,255,255,0.98);
    border-radius: 24px;
    padding: 28px 22px 32px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: pop 0.8s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    margin: 0 0 18px;
    font-size: 26px;
    color: #ff2f68;
    font-weight: 700;
  }

  p {
    font-size: 17px;
    color: #444;
    line-height: 1.5;
    margin-bottom: 26px;
  }

  .btns {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    min-width: 130px;
    padding: 14px 26px;
    font-size: 18px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  #yes {
    background: linear-gradient(135deg, #ff2f68, #ff7eb3);
    color: white;
    box-shadow: 0 10px 25px rgba(255,47,104,0.4);
  }

  #no {
    background: #e6e6e6;
    color: #555;
    position: fixed;
    z-index: 5;
  }

  .final h1 {
    font-size: 28px;
    margin-bottom: 16px;
  }

  .final p {
    font-size: 19px;
    color: #ff2f68;
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Nilisha 💖</h1>
  <p>
    Ek simple sa sawal hai…<br>
    par dil se hai ❤️<br><br>
    Kya tum meri life ka sabse
    important hissa banogi?
  </p>

  <div class="btns">
    <button id="yes">Yes 🙂</button>
    <button id="no">No 😌</button>
  </div>
</div>

<script>
  const card = document.getElementById("card");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  function moveNo() {
    const pad = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - pad;
    const maxY = window.innerHeight - noBtn.offsetHeight - pad;
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  yesBtn.addEventListener("click", () => {
    card.innerHTML = `
      <div class="final">
        <h1>🥹❤️</h1>
        <p>
          Nilisha…<br><br>
          tumne sirf “Yes” nahi bola,<br>
          tumne mera dil jeet liya 😌💫<br><br>
          Ab jo bhi ho,<br>
          saath ho ❤️🤞<br><br>
          Always you. Always us. 💖✨
        </p>
      </div>
    `;
  });

  /* subtle floating glow */
  setInterval(() => {
    const g = document.createElement("div");
    g.className = "glow";
    g.style.left = Math.random() * 100 + "vw";
    g.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 7000);
  }, 450);
</script>

</body>
</html>
