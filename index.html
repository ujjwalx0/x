<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You 💖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Poppins",system-ui;
  background:
    radial-gradient(circle at top left,#ff4f9a,transparent 40%),
    radial-gradient(circle at bottom right,#7b2cff,transparent 45%),
    #0b0b14;
  overflow:hidden;
  padding:16px;
}

/* floating emojis */
.emoji{
  position:absolute;
  font-size:22px;
  animation:float 6s linear infinite;
  pointer-events:none;
}

@keyframes float{
  from{transform:translateY(110vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}

.card{
  width:100%;
  max-width:400px;
  padding:32px 26px 36px;
  border-radius:30px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  box-shadow:0 40px 100px rgba(0,0,0,.5);
  color:#fff;
  text-align:center;
  animation:pop .7s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  margin:0 0 14px;
  font-size:34px;
  font-weight:700;
  background:linear-gradient(135deg,#ff9bd5,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16.5px;
  line-height:1.65;
  opacity:.95;
}

.question{
  margin:22px 0 8px;
  font-size:20px;
  font-weight:600;
}

.subline{
  font-size:14.5px;
  opacity:.85;
  margin-bottom:24px;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:16px 0;
  font-size:17px;
  border:none;
  border-radius:22px;
  cursor:pointer;
  transition:.15s ease;
}

button:active{transform:scale(.94)}

#yes{
  background:linear-gradient(135deg,#ff3b7f,#ff92d0);
  color:#fff;
  box-shadow:0 16px 40px rgba(255,59,127,.55);
}

#no{
  background:rgba(255,255,255,.25);
  color:#fff;
  position:relative;
}

/* giphy */
.gif{
  width:100%;
  border-radius:18px;
  margin-top:18px;
}

.final h1{
  font-size:44px;
}
.final p{
  font-size:18px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name">You</h1>

  <p id="intro">
    When you smile,<br>
    everything feels a little more beautiful ✨
  </p>

  <div class="question">
    Would you like to be with me? 💫
  </div>

  <div class="subline">
    (No button is just for decoration 😌)
  </div>

  <div class="btns">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
/* ===== NAME FROM URL PATH ===== */
const pathName = decodeURIComponent(
  window.location.pathname.split("/").filter(Boolean).pop() || "You"
);

const cleanName =
  pathName.charAt(0).toUpperCase() + pathName.slice(1).toLowerCase();

document.getElementById("name").innerText = cleanName;
document.getElementById("intro").innerHTML =
  `Hey ${cleanName},<br>this little page is just for you 💖`;

/* ===== NO BUTTON ULTRA FAST RUN ===== */
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const card = document.getElementById("card");

function runAway(){
  const x = Math.random()*400 - 200;
  const y = Math.random()*260 - 130;
  noBtn.style.transform = `translate(${x}px,${y}px)`;
}

["mouseenter","touchstart","mousemove","wheel"].forEach(evt=>{
  noBtn.addEventListener(evt, runAway);
});

/* ===== YES CLICK ===== */
yesBtn.addEventListener("click", ()=>{
  card.innerHTML = `
    <div class="final">
      <h1>💖</h1>
      <p>
        ${cleanName},<br><br>
        You just made my day 😭✨<br>
        This feels like the start of something really special 💫
      </p>

      <img class="gif"
        src="https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif"
        alt="love gif">
    </div>
  `;
});

/* ===== FLOATING EMOJIS ===== */
const emojis = ["💖","✨","💘","😍","💫"];
setInterval(()=>{
  const e=document.createElement("div");
  e.className="emoji";
  e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=3+Math.random()*3+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),7000);
},380);
</script>

</body>
</html>
