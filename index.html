<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>A Question</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(70% 50% at 20% 10%, #ff4d9d66, transparent),
    radial-gradient(60% 50% at 80% 90%, #7b4dff66, transparent),
    #06060c;
  color:#fff;
  padding:14px;
  overflow:hidden;
}

.card{
  width:100%;
  max-width:380px;
  padding:26px 20px 28px;
  border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(22px);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  text-align:center;
  animation:enter .7s ease;
}

@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 8px;
  font-size:28px;
  font-weight:700;
  background:linear-gradient(135deg,#ffd6eb,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:15.2px;
  line-height:1.6;
  margin:0 0 12px;
}

.hero{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:18px;
  margin:12px 0 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.question{
  font-size:18px;
  font-weight:600;
  margin-bottom:6px;
}

.sub{
  font-size:13.5px;
  opacity:.82;
  margin-bottom:18px;
}

.btns{
  display:flex;
  gap:12px;
}

button{
  flex:1;
  padding:14px 0;
  font-size:15.5px;
  border:none;
  border-radius:22px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,#ff2f7d,#ff8fd1);
  color:#fff;
  box-shadow:0 14px 40px rgba(255,47,125,.55);
}

#no{
  background:rgba(255,255,255,.25);
  color:#fff;
  position:relative;
}

.final h1{font-size:34px}
.final p{font-size:15.8px}

.gif{
  width:100%;
  max-height:240px;
  object-fit:cover;
  border-radius:18px;
  margin-top:18px;
}

/* subtle floating dots (cool extra) */
.dot{
  position:absolute;
  width:6px;height:6px;border-radius:50%;
  background:#fff3;
  animation:float 6s linear infinite;
}
@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-10vh)}
}

button:active{transform:scale(.96)}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>
  <p id="intro"></p>

  <!-- BEFORE YES: PROPOSAL / COOL ONLY -->
  <img class="hero" id="heroGif" alt="moment">

  <div class="question">
    Do you choose me — for what comes next?
  </div>

  <div class="sub">
    Yes = you want me in your life.<br>
    No = you don’t feel the same.
  </div>

  <div class="btns">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
/* ================= NAME (query param) ================= */
const params=new URLSearchParams(location.search);
const raw=params.get("query")||"You";
const name=raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();

document.getElementById("name").innerText=name;
document.getElementById("intro").innerHTML=
  `Hey ${name},<br>quiet confidence. honest intent.`;

/* ================= GIF LISTS ================= */
/* BEFORE YES: ONE COOL PROPOSAL + MANY PROPOSAL/ASKING (NO HUG/KISS) */
const coolProposal =
  "https://media.giphy.com/media/xUPGcguWZHRC2HyBRS/giphy.gif"; // cool standout

const proposalGifs=[
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
  "https://media.giphy.com/media/3oriO6qJiXajN0TyDu/giphy.gif",
  "https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif",
  "https://media.giphy.com/media/26BRrSvJUa0crqw4E/giphy.gif",
  "https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif"
];

/* AFTER YES: LOTS OF HUGS / KISSES / DANCE (ROMANTIC) */
const afterYesGifs=[
  "https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif",
  "https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif",
  "https://media.giphy.com/media/HaC1WdpkL3W00/giphy.gif",
  "https://media.giphy.com/media/gnXG2hODaCOru/giphy.gif",
  "https://media.giphy.com/media/3oEjI4sFlp73fvEYgw/giphy.gif",
  "https://media.giphy.com/media/12hvLuZ7uzvCvK/giphy.gif",
  "https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif"
];

const pick=a=>a[Math.floor(Math.random()*a.length)];

/* Load BEFORE YES: mix cool + proposal */
const hero=document.getElementById("heroGif");
hero.src = Math.random()<0.35 ? coolProposal : pick(proposalGifs);

/* ================= NO BUTTON (PROXIMITY, MOBILE SAFE) ================= */
const no=document.getElementById("no");

function near(x,y){
  const r=no.getBoundingClientRect();
  return Math.hypot(
    x-(r.left+r.width/2),
    y-(r.top+r.height/2)
  )<70;
}
function run(){
  no.style.transform=
    `translate(${Math.random()*160-80}px,${Math.random()*120-60}px)`;
}
document.addEventListener("mousemove",e=>{ if(near(e.clientX,e.clientY)) run(); });
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(near(t.clientX,t.clientY)) run();
},{passive:true});

/* ================= YES CLICK (AFTER YES ONLY) ================= */
document.getElementById("yes").onclick=()=>{
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>🤍</h1>
      <p>
        ${name},<br><br>
        then stay.<br>
        calm. real. together.
      </p>
      <img class="gif" src="${pick(afterYesGifs)}">
    </div>
  `;
};

/* ================= COOL EXTRA: FLOATING DOTS ================= */
setInterval(()=>{
  const d=document.createElement("div");
  d.className="dot";
  d.style.left=Math.random()*100+"vw";
  d.style.animationDuration=4+Math.random()*4+"s";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),8000);
},520);
</script>

</body>
</html>
