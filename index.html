<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Real Moment 💖</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
* { -webkit-tap-highlight-color: transparent }

/* ===== ENTRY CINEMATIC ===== */
@keyframes zoomIn {
  0% { transform: scale(1.4); opacity:0 }
  100% { transform: scale(1); opacity:1 }
}
@keyframes bgPulse {
  0%,100% { opacity:.6 }
  50% { opacity:1 }
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(18px) }
  to { opacity:1; transform:none }
}
@keyframes glow {
  0%,100% { box-shadow:0 0 40px rgba(255,105,180,.35) }
  50% { box-shadow:0 0 90px rgba(255,105,180,.6) }
}
@keyframes heartPop {
  from { transform: scale(.4); opacity:1 }
  to { transform: scale(2); opacity:0 }
}

.intro { animation: zoomIn .9s ease forwards }
.fade { animation: fadeUp .6s ease forwards }
.glow { animation: glow 5s ease-in-out infinite }
.pulse { animation: bgPulse 6s ease-in-out infinite }

.heart {
  position: fixed;
  font-size: 26px;
  animation: heartPop 1.1s ease forwards;
  pointer-events:none;
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-100 to-white flex items-center justify-center overflow-hidden">

<!-- Heavy Intro Glow -->
<div class="absolute inset-0 bg-gradient-to-br from-pink-200/40 to-rose-200/30 pulse"></div>

<!-- APP -->
<div class="relative z-10 w-full max-w-md mx-auto px-4">
  <div id="card"
   class="bg-white/85 backdrop-blur-xl rounded-3xl p-7 text-center glow intro">
  </div>
</div>

<!-- MODAL -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50 px-4">
  <div class="bg-white rounded-3xl p-6 w-full max-w-md text-center fade">
    <h2 class="text-2xl font-semibold text-pink-500">Just one honest moment 💌</h2>

    <p class="mt-3 text-gray-600 text-sm leading-relaxed">
      No pressure 🌸<br>
      Just say what feels true right now.
    </p>

    <textarea id="reply"
      class="mt-4 w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-300 outline-none text-sm"
      placeholder="Write from your heart… 💖"></textarea>

    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-semibold shadow-md active:scale-95 transition">
      Save this moment 💞
    </button>
  </div>
</div>

<script>
/* ===== NAME ===== */
const q=new URLSearchParams(location.search);
const name=(q.get("query")||"You").replace(/^\w/,c=>c.toUpperCase());

const card=document.getElementById("card");
const modal=document.getElementById("modal");

/* ===== FIRST SCREEN (TEXT SAME) ===== */
function start(){
card.innerHTML=`
<h1 class="text-3xl font-semibold text-gray-800">${name} 🌸</h1>

<p class="mt-4 text-gray-700 text-lg leading-relaxed">
Some moments don’t ask loudly.<br>
They just feel right… quietly ✨
</p>

<p class="mt-6 text-xl font-medium text-gray-900">
If I asked you to choose this feeling with me 💖
</p>

<p class="mt-2 text-sm text-gray-600">
what would your heart say?
</p>

<div class="mt-7 flex justify-center gap-3">
<button id="yes"
 class="px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-400 to-rose-500 text-white text-sm font-semibold shadow-md active:scale-95">
Yes 💕
</button>

<button id="no"
 class="px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-xs">
No 🙈
</button>
</div>

<p class="mt-5 text-xs text-gray-500">
This moment is safe 🤍
</p>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;

document.getElementById("yes").onclick=()=>{
burst();
modal.classList.remove("hidden");
modal.classList.add("flex");
};
}

/* ===== FINAL SCREEN (TEXT CHANGED) ===== */
function final(msg){
card.innerHTML=`
<h1 class="text-4xl">💖✨💖</h1>

<p class="mt-4 text-lg text-gray-800">
You chose yes, ${name}.<br>
And this moment just became special 🥹
</p>

<blockquote class="mt-6 italic text-gray-700 border-l-4 border-pink-400 pl-4">
"${msg}"
</blockquote>

<img
 class="mt-8 rounded-2xl shadow-xl mx-auto"
 src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmZkN3B6d2o3M2R6eXNzYTZyZDBkbTRhYzV1NXFndm9yY2h0b3F3eSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/26FLdmIp6wJr91JAI/giphy.gif"
/>

<p class="mt-6 text-sm text-gray-500">
Some feelings don’t fade.<br>
They stay. 💞
</p>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;
}

/* ===== SAVE ===== */
document.getElementById("save").onclick=()=>{
const msg=document.getElementById("reply").value.trim();
if(!msg) return;
modal.classList.add("hidden");
final(msg);
};

/* ===== HEART BLAST ===== */
function burst(){
for(let i=0;i<22;i++){
const h=document.createElement("div");
h.className="heart";
h.innerText="💖";
h.style.left=Math.random()*100+"vw";
h.style.top=Math.random()*100+"vh";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1100);
}
}

/* ===== NO RUN ===== */
document.addEventListener("mousemove",e=>run(e.clientX,e.clientY));
document.addEventListener("touchmove",e=>{
const t=e.touches[0]; run(t.clientX,t.clientY);
},{passive:true});

function run(x,y){
const no=document.getElementById("no");
if(!no) return;
const r=no.getBoundingClientRect();
if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<80){
no.style.transform=`translate(${Math.random()*160-80}px,${Math.random()*120-60}px)`;
}
}

/* ===== INIT ===== */
setTimeout(start,300);
</script>

</body>
</html>
