<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Real Moment 💖</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
* { -webkit-tap-highlight-color: transparent }

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px) }
  to { opacity:1; transform:none }
}
@keyframes glow {
  0%,100% { box-shadow:0 0 40px rgba(255,105,180,.35) }
  50% { box-shadow:0 0 90px rgba(255,105,180,.6) }
}
@keyframes heartPop {
  from { transform: scale(.4); opacity:1 }
  to { transform: scale(2); opacity:0 }
}

.fade { animation: fadeUp .7s ease forwards }
.glow { animation: glow 5s ease-in-out infinite }

.heart {
  position: fixed;
  font-size: 26px;
  animation: heartPop 1.1s ease forwards;
  pointer-events:none;
}

/* ===== FIREWORKS ===== */
#fireworks {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 30;
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-100 to-white flex items-center justify-center overflow-hidden">

<canvas id="fireworks"></canvas>

<!-- Audio -->
<audio id="bgMusic" loop muted>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_8c3a8f2f98.mp3" type="audio/mpeg">
</audio>

<!-- App -->
<div class="relative z-10 w-full max-w-md mx-auto px-4">
  <div id="card"
   class="bg-white/85 backdrop-blur-xl rounded-3xl p-7 text-center glow fade"></div>
</div>

<!-- Modal -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/50 z-40 px-4">
  <div class="bg-white rounded-3xl p-6 w-full max-w-md text-center fade">
    <h2 class="text-2xl font-semibold text-pink-500">One honest moment 💌</h2>
    <textarea id="reply"
      class="mt-4 w-full p-3 border rounded-xl outline-none text-sm"
      placeholder="Write what feels real…"></textarea>
    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-semibold">
      Save 💖
    </button>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const BIN_ID="69809848ae596e708f0b60cd";
const API_KEY="$2a$10$SWRs0c4zsOCWZY5mPavGI.CFoLPsZilAUB1XKFEUU7r0kcOJ9jPSC";
const BASE_URL=`https://api.jsonbin.io/v3/b/${BIN_ID}`;

/* ================= HELPERS ================= */
async function getData(){
  const r=await fetch(BASE_URL,{headers:{ "X-Access-Key":API_KEY }});
  return (await r.json()).record;
}

async function saveYes(message){
  const data=await getData();
  data.responses.push({
    name,deviceId,message,
    time:new Date().toLocaleString()
  });
  await fetch(BASE_URL,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Access-Key":API_KEY
    },
    body:JSON.stringify(data)
  });
}

/* ================= IDENTITY ================= */
const params=new URLSearchParams(location.search);
const isAdmin=params.get("admin")==="1";
const name=(params.get("query")||"You").replace(/^\w/,c=>c.toUpperCase());

let deviceId=localStorage.getItem("device_id");
if(!deviceId){
  deviceId=crypto.randomUUID();
  localStorage.setItem("device_id",deviceId);
}

/* ================= AUDIO ================= */
const music=document.getElementById("bgMusic");
function startMusic(){
  music.muted=false;
  music.volume=0;
  music.play();
  let v=0;
  const fade=setInterval(()=>{
    v+=0.05;
    music.volume=Math.min(v,0.6);
    if(v>=0.6) clearInterval(fade);
  },200);
}
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

/* ================= UI ================= */
const card=document.getElementById("card");
const modal=document.getElementById("modal");

/* ===== USER VIEW ===== */
function renderStart(){
card.innerHTML=`
<h1 class="text-3xl font-semibold">${name} 🌸</h1>
<p class="mt-4 text-lg">Some moments just feel right ✨</p>

<div class="mt-6 flex justify-center gap-3">
<button id="yes"
 class="px-6 py-2 rounded-full bg-pink-500 text-white">
Yes 💖
</button>
<button id="no"
 class="px-4 py-2 rounded-full bg-gray-200 text-xs">
No 🙈
</button>
</div>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;

document.getElementById("yes").onclick=()=>{
burst();
modal.classList.remove("hidden");
modal.classList.add("flex");
};
}

function renderFinal(msg){
startFireworks();
card.innerHTML=`
<h1 class="text-4xl">🎆💖🎆</h1>
<p class="mt-4 text-lg">You chose this moment.</p>
<blockquote class="mt-6 italic border-l-4 border-pink-400 pl-4">
"${msg}"
</blockquote>
<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;
}

/* ===== ADMIN VIEW ===== */
function renderAdmin(list){
card.innerHTML=`
<h1 class="text-2xl font-semibold mb-4">Admin Panel 🧾</h1>
<div class="space-y-3 max-h-[60vh] overflow-y-auto text-left">
${list.map(r=>`
<div class="p-3 bg-pink-50 rounded-xl">
<p class="text-sm font-semibold">${r.name}</p>
<p class="text-xs italic mt-1">"${r.message}"</p>
<p class="text-[10px] text-gray-400 mt-1">${r.time}</p>
</div>
`).join("")}
</div>
`;
}

/* ================= SAVE ================= */
document.getElementById("save").onclick=async()=>{
  const msg=document.getElementById("reply").value.trim();
  if(!msg) return;
  await saveYes(msg);
  modal.classList.add("hidden");
  renderFinal(msg);
};

/* ================= HEARTS ================= */
function burst(){
  for(let i=0;i<18;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="💖";
    h.style.left=Math.random()*100+"vw";
    h.style.top=Math.random()*100+"vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1100);
  }
}

/* ================= FIREWORKS ================= */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

function startFireworks(){
for(let i=0;i<120;i++){
setTimeout(()=>{
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
ctx.beginPath();
ctx.arc(
Math.random()*canvas.width,
Math.random()*canvas.height/2,
Math.random()*3+1,
0,Math.PI*2
);
ctx.fill();
},i*30);
}
}

/* ================= INIT ================= */
(async()=>{
  const data=await getData();
  if(isAdmin){
    renderAdmin(data.responses);
    return;
  }
  const existing=[...data.responses].reverse()
    .find(r=>r.name===name && r.deviceId===deviceId);

  if(existing){
    renderFinal(existing.message);
  }else{
    renderStart();
  }
})();
</script>

</body>
</html>
