<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question That Matters</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(60% 60% at 20% 10%, #ff4d9d44, transparent),
    radial-gradient(50% 50% at 80% 90%, #7b4dff44, transparent),
    #07070d;
  overflow:hidden;
  padding:18px;
  color:#fff;
}

.card{
  width:100%;
  max-width:420px;
  padding:38px 26px 42px;
  border-radius:34px;
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(26px);
  box-shadow:0 50px 140px rgba(0,0,0,.65);
  text-align:center;
  animation:enter .7s ease;
}

@keyframes enter{
  from{transform:translateY(20px) scale(.96);opacity:0}
  to{transform:none;opacity:1}
}

h1{
  margin:0 0 14px;
  font-size:34px;
  font-weight:700;
  background:linear-gradient(135deg,#ffd6eb,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16.6px;
  line-height:1.7;
  opacity:.96;
}

.hero{
  width:100%;
  border-radius:22px;
  margin:18px 0 22px;
}

.question{
  margin:18px 0 8px;
  font-size:21px;
  font-weight:600;
}

.meaning{
  font-size:14.5px;
  opacity:.82;
  margin-bottom:26px;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:17px 0;
  font-size:16.8px;
  border:none;
  border-radius:26px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,#ff2f7d,#ff8fd1);
  color:#fff;
  box-shadow:0 18px 50px rgba(255,47,125,.55);
}

#no{
  background:rgba(255,255,255,.22);
  color:#fff;
  position:relative;
}

.final h1{font-size:42px}
.final p{font-size:17.8px}

.gif{
  width:100%;
  border-radius:22px;
  margin-top:24px;
}

/* floating minimal particles */
.dot{
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  background:#fff3;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-10vh)}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>

  <p id="intro"></p>

  <!-- PROPOSAL MOMENT -->
  <img class="hero"
    src="https://media.giphy.com/media/xUPGcguWZHRC2HyBRS/giphy.gif"
    alt="moment">

  <div class="question">
    Do you choose me — not just now, but for the long run?
  </div>

  <div class="meaning">
    Yes = “I want you in my life.”  
    <br>No = “I don’t feel that way.”
  </div>

  <div class="btns">
    <button id="yes">Yes, I choose you</button>
    <button id="no">No, I don’t</button>
  </div>
</div>

<script>
/* ===== NAME FROM URL ===== */
const params=new URLSearchParams(location.search);
const raw=params.get("name")||"You";
const name=raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();

document.getElementById("name").innerText=name;
document.getElementById("intro").innerHTML=
  `Hey ${name},<br>
   this isn’t about a moment.<br>
   It’s about intention.`;

/* ===== NO BUTTON (ONLY WHEN CLOSE) ===== */
const no=document.getElementById("no");

function near(x,y){
  const r=no.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  return Math.hypot(x-cx,y-cy)<85;
}

function run(){
  const x=Math.random()*260-130;
  const y=Math.random()*180-90;
  no.style.transform=`translate(${x}px,${y}px)`;
}

document.addEventListener("mousemove",e=>{
  if(near(e.clientX,e.clientY)) run();
});
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(near(t.clientX,t.clientY)) run();
});

/* ===== YES CLICK (LIFETIME HUG) ===== */
document.getElementById("yes").onclick=()=>{
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>🤍</h1>
      <p>
        ${name},<br><br>
        then come here.<br>
        this hug isn’t loud — it’s real 🤍<br><br>
        let’s stay.
      </p>
      <img class="gif"
        src="https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif">
    </div>
  `;
};

/* ===== FLOATING DOTS ===== */
setInterval(()=>{
  const d=document.createElement("div");
  d.className="dot";
  d.style.left=Math.random()*100+"vw";
  d.style.animationDuration=4+Math.random()*4+"s";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),8000);
},500);
</script>

</body>
</html>
