<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>This Moment 💖</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{ -webkit-tap-highlight-color:transparent }

/* ===== LOVE ANIMATIONS ===== */
@keyframes softFade {
  from{opacity:0; transform:translateY(20px)}
  to{opacity:1; transform:none}
}
@keyframes glow {
  0%,100%{ box-shadow:0 0 40px rgba(255,90,150,.35) }
  50%{ box-shadow:0 0 90px rgba(255,90,150,.6) }
}
@keyframes heartPop {
  from{ transform:scale(.3); opacity:1 }
  to{ transform:scale(2); opacity:0 }
}
@keyframes float {
  0%,100%{ transform:translateY(0) }
  50%{ transform:translateY(-12px) }
}

.fade{ animation:softFade .8s ease forwards }
.glow{ animation:glow 6s ease-in-out infinite }
.float{ animation:float 6s ease-in-out infinite }

.heart{
  position:fixed;
  font-size:26px;
  animation:heartPop 1.1s ease forwards;
  pointer-events:none;
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-rose-100 via-pink-100 to-white flex items-center justify-center overflow-hidden">

<!-- soft glow -->
<div class="absolute -top-40 -left-40 w-[400px] h-[400px] bg-pink-300/40 blur-3xl rounded-full float"></div>
<div class="absolute -bottom-40 -right-40 w-[420px] h-[420px] bg-rose-200/40 blur-3xl rounded-full float"></div>

<!-- romantic music -->
<audio id="bgMusic" loop muted>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_8c3a8f2f98.mp3">
</audio>

<!-- APP -->
<div class="relative z-10 w-full max-w-md mx-auto px-4">
  <div id="card"
    class="bg-white/85 backdrop-blur-xl rounded-[28px] p-8 text-center glow fade">
  </div>
</div>

<!-- REPLY MODAL -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/50 z-40 px-4">
  <div class="bg-white rounded-[26px] p-6 w-full max-w-md fade">
    <h2 class="text-2xl font-semibold text-pink-500 text-center">
      A few honest words 💌
    </h2>

    <p class="mt-3 text-sm text-gray-600 text-center leading-relaxed">
      No expectations.  
      No labels.  
      Just what feels real in this moment.
    </p>

    <div class="mt-4 bg-pink-50 rounded-2xl p-4">
      <textarea id="reply"
        class="w-full bg-transparent outline-none resize-none text-sm"
        rows="4"
        placeholder="Write from the heart…"></textarea>
    </div>

    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-semibold shadow-md active:scale-95">
      Keep this moment 💖
    </button>
  </div>
</div>

<script>
/* ========= CONFIG (SAME LOGIC) ========= */
const BIN_ID="69809848ae596e708f0b60cd";
const API_KEY="$2a$10$SWRs0c4zsOCWZY5mPavGI.CFoLPsZilAUB1XKFEUU7r0kcOJ9jPSC";
const BASE_URL=`https://api.jsonbin.io/v3/b/${BIN_ID}`;

/* ========= NAME + DEVICE ========= */
const p=new URLSearchParams(location.search);
const name=(p.get("query")||"You").replace(/^\w/,c=>c.toUpperCase());

let deviceId=localStorage.getItem("device_id");
if(!deviceId){
  deviceId=crypto.randomUUID();
  localStorage.setItem("device_id",deviceId);
}

/* ========= AUDIO ========= */
const music=document.getElementById("bgMusic");
function startMusic(){
  music.muted=false;
  music.volume=0;
  music.play();
  let v=0;
  const i=setInterval(()=>{
    v+=0.05;
    music.volume=Math.min(v,0.6);
    if(v>=0.6) clearInterval(i);
  },200);
}
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

/* ========= JSONBIN ========= */
async function getData(){
  const r=await fetch(BASE_URL,{headers:{ "X-Access-Key":API_KEY }});
  return (await r.json()).record;
}
async function saveYes(message){
  const data=await getData();
  data.responses.push({name,deviceId,message,time:new Date().toISOString()});
  await fetch(BASE_URL,{
    method:"PUT",
    headers:{ "Content-Type":"application/json","X-Access-Key":API_KEY },
    body:JSON.stringify(data)
  });
}

/* ========= UI ========= */
const card=document.getElementById("card");
const modal=document.getElementById("modal");

function renderStart(){
card.innerHTML=`
<h1 class="text-3xl font-semibold text-gray-800">${name}</h1>

<p class="mt-5 text-lg text-gray-700 leading-relaxed">
Some connections don’t arrive with noise.<br>
They arrive softly…<br>
and somehow feel like home.
</p>

<p class="mt-6 text-xl font-medium text-gray-900">
If I asked you to choose this feeling with me —
</p>

<p class="mt-2 text-sm text-gray-600">
not forever, not promises… just this moment —
</p>

<p class="mt-2 text-sm text-gray-600">
what would you choose?
</p>

<div class="mt-8 flex justify-center gap-4">
<button id="yes"
 class="px-7 py-3 rounded-full bg-gradient-to-r from-pink-400 to-rose-500 text-white text-sm font-semibold shadow-lg active:scale-95">
Yes 💖
</button>

<button id="no"
 class="px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-xs">
No 🙈
</button>
</div>

<p class="mt-6 text-xs text-gray-500">
This moment is safe 🤍
</p>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;

document.getElementById("yes").onclick=()=>{
burst();
modal.classList.remove("hidden");
modal.classList.add("flex");
};
}

function renderFinal(msg){
card.innerHTML=`
<h1 class="text-4xl">💖✨💖</h1>

<p class="mt-5 text-lg text-gray-800 leading-relaxed">
You chose this moment.<br>
And that choice… means more than you know.
</p>

<blockquote class="mt-6 italic text-gray-700 border-l-4 border-pink-400 pl-4">
"${msg}"
</blockquote>

<p class="mt-6 text-sm text-gray-500">
Some moments don’t fade.<br>
They stay.
</p>

<footer class="mt-6 text-[11px] text-gray-400">
with love, for love ❤️ — Ujjwal
</footer>
`;
}

/* ========= SAVE ========= */
document.getElementById("save").onclick=async()=>{
  const msg=document.getElementById("reply").value.trim();
  if(!msg) return;
  await saveYes(msg);
  modal.classList.add("hidden");
  renderFinal(msg);
};

/* ========= HEARTS ========= */
function burst(){
  for(let i=0;i<24;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="💖";
    h.style.left=Math.random()*100+"vw";
    h.style.top=Math.random()*100+"vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1100);
  }
}

/* ========= INIT ========= */
(async()=>{
  const data=await getData();
  const existing=[...data.responses].reverse()
    .find(r=>r.name===name && r.deviceId===deviceId);
  if(existing){
    renderFinal(existing.message);
  }else{
    renderStart();
  }
})();
</script>

</body>
</html>
