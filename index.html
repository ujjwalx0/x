<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>This Moment</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-gradient-to-br from-neutral-50 via-rose-50 to-white flex items-center justify-center overflow-hidden">

<!-- ambient -->
<div class="ambient a1"></div>
<div class="ambient a2"></div>

<!-- audio -->
<audio id="bgMusic" loop muted>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_8c3a8f2f98.mp3">
</audio>

<!-- APP -->
<div class="relative z-10 w-full max-w-md mx-auto px-4">
  <div id="card" class="card"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 class="title">Say it honestly</h2>
    <p class="sub">
      No pressure. No performance.<br>Just what you feel.
    </p>

    <textarea id="reply" rows="4" placeholder="Write what feels right…"></textarea>

    <button id="save">Save this moment</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
