<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Real Feeling</title>

<style>
/* ---------- RESET ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}

/* ---------- THEME ---------- */
:root{
  --bg:#0b0b14;
  --card:#151527;
  --primary:#ff5fa2;
  --secondary:#ff9bd5;
  --text:#ffffff;
  --soft:#ffd9ec;
}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(70% 50% at 15% 10%, #ff5fa255, transparent),
    radial-gradient(60% 50% at 85% 90%, #ff9bd555, transparent),
    var(--bg);
  color:var(--text);
  padding:14px;
  overflow:hidden;
}

/* ---------- CARD ---------- */
.card{
  width:100%;
  max-width:380px;
  background:linear-gradient(180deg,#1a1a33,#111125);
  border-radius:30px;
  padding:26px 22px 28px;
  box-shadow:0 35px 120px rgba(0,0,0,.7);
  text-align:center;
  animation:appear .8s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes appear{
  from{opacity:0;transform:translateY(22px) scale(.95)}
  to{opacity:1;transform:none}
}

/* ---------- TEXT ---------- */
h1{
  margin:0 0 6px;
  font-size:30px;
  font-weight:700;
  color:var(--primary);
}

.emojis{
  font-size:24px;
  margin:10px 0 8px;
}

p{
  font-size:15.6px;
  line-height:1.65;
  color:var(--soft);
  margin:0 0 14px;
}

.question{
  font-size:19px;
  font-weight:600;
  color:#fff;
  margin-bottom:8px;
}

.hint{
  font-size:13.4px;
  color:#ffc0dd;
  margin-bottom:20px;
}

/* ---------- BUTTONS ---------- */
.btns{
  display:flex;
  gap:12px;
}

button{
  flex:1;
  padding:14px 0;
  font-size:15.8px;
  border:none;
  border-radius:22px;
  cursor:pointer;
  transition:transform .12s ease;
}

button:active{transform:scale(.95)}

#yes{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#2a0014;
  font-weight:600;
}

#no{
  background:#1f1f3f;
  color:#fff;
  position:relative;
}
@media (pointer: coarse){
  #no{
    transition:
      transform 0.04s linear,
      left 0.04s linear,
      top 0.04s linear;
  }
}

.small{
  margin-top:10px;
  font-size:12.6px;
  color:#ffb6d5;
}

/* ---------- AFTER YES ---------- */
.final h1{
  font-size:32px;
  margin-bottom:10px;
}

.final p{
  font-size:16px;
  color:#ffe4f1;
}

.gif{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:20px;
  margin-top:18px;
  box-shadow:0 22px 70px rgba(0,0,0,.55);
}

/* ---------- LOVE PARTICLES ---------- */
.spark{
  position:absolute;
  font-size:22px;
  pointer-events:none;
  animation:floatUp 2.4s ease forwards;
}

@keyframes floatUp{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-150px);opacity:0}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>

  <div class="emojis">💖 💋 🤍 💫</div>

  <p id="intro"></p>

  <div class="question">
    I don’t like you casually.<br>
    I like you intentionally.
  </div>

  <div class="hint">
    If you feel it too, choose yes.<br>
    If not, choose no.
  </div>

  <div class="btns">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <div class="small">
    Honest feelings only.
  </div>
</div>

<script>
/* ---------- NAME ---------- */
const params=new URLSearchParams(location.search);
const raw=params.get("query")||"You";
const name=raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();

document.getElementById("name").innerText=name;
document.getElementById("intro").innerHTML=
  `Hey ${name},<br>
   this moment is real, calm, and from the heart.`;

/* ---------- NO BUTTON (VERY FAST) ---------- */
const no=document.getElementById("no");

function near(x,y){
  const r=no.getBoundingClientRect();
  return Math.hypot(
    x-(r.left+r.width/2),
    y-(r.top+r.height/2)
  ) < 50;
}

function dodge(){
  no.style.transition="transform .05s linear";
  no.style.transform=
    `translate(${Math.random()*280-140}px,${Math.random()*200-100}px)`;
}

document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(near(t.clientX,t.clientY)) dodge();
},{passive:true});

document.addEventListener("mousemove",e=>{
  if(near(e.clientX,e.clientY)) dodge();
});

/* ---------- YES ACTION ---------- */
const loveGifs=[
 "https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif",
 "https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif",
 "https://media.giphy.com/media/HaC1WdpkL3W00/giphy.gif",
 "https://media.giphy.com/media/gnXG2hODaCOru/giphy.gif"
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

document.getElementById("yes").onclick=()=>{
  celebrate();
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>This made me smile 💖</h1>
      <p>
        ${name}, this feels warm and exciting.<br>
        Something worth choosing again and again.
      </p>
      <img class="gif" src="${pick(loveGifs)}">
    </div>
  `;
};

function celebrate(){
  const icons=["💖","💋","😘","😍","🤍","💫"];
  for(let i=0;i<22;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.innerText=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.bottom="18vh";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2400);
  }
}
</script>

</body>
</html>
