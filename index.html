<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You 💖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: "Poppins", system-ui;
  background:
    radial-gradient(circle at top, #ff5fa2, transparent 40%),
    radial-gradient(circle at bottom, #7f00ff, transparent 45%),
    #0d0d16;
  overflow:hidden;
  padding:16px;
}

/* floating emojis */
.emoji{
  position:absolute;
  font-size:22px;
  animation:float 7s linear infinite;
  pointer-events:none;
}

@keyframes float{
  from{transform:translateY(110vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}

.card{
  width:100%;
  max-width:380px;
  padding:28px 24px 32px;
  border-radius:26px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(16px);
  box-shadow:0 30px 80px rgba(0,0,0,0.4);
  color:#fff;
  text-align:center;
  animation:pop .7s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  margin:0 0 12px;
  font-size:30px;
  font-weight:700;
  background:linear-gradient(135deg,#ff9bd5,#fff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16px;
  line-height:1.6;
  opacity:.95;
}

.question{
  margin:26px 0;
  font-size:18px;
  font-weight:600;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:14px 0;
  font-size:17px;
  border:none;
  border-radius:18px;
  cursor:pointer;
  transition:.15s ease;
}

button:active{transform:scale(.94)}

#yes{
  background:linear-gradient(135deg,#ff3d81,#ff8fd1);
  color:#fff;
  box-shadow:0 12px 30px rgba(255,61,129,.5);
}

#no{
  background:rgba(255,255,255,.25);
  color:#fff;
  position:relative;
}

.final h1{
  font-size:42px;
}

.final p{
  font-size:18px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name">You</h1>

  <p>
    Jab tum paas hoti ho,<br>
    duniya thodi zyada hi achhi lagti hai ✨
  </p>

  <div class="question">
    Kya tum mere saath chalogi? 💫
  </div>

  <div class="btns">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
/* ========= DATA OBJECT ========= */
const girls = {
  ns: { name: "Nilisha" },
  ap: { name: "Aarohi" },
  kv: { name: "Kavya" },
  sn: { name: "Sneha" }
};

/* ========= URL NAME LOAD ========= */
const params = new URLSearchParams(window.location.search);
const key = params.get("k");
const girlName = girls[key]?.name || "Someone Special";
document.getElementById("name").innerText = girlName;

/* ========= BUTTON LOGIC ========= */
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const card = document.getElementById("card");

function runAway(){
  const x = Math.random()*240 - 120;
  const y = Math.random()*160 - 80;
  noBtn.style.transform = `translate(${x}px,${y}px)`;
}

noBtn.addEventListener("mouseenter", runAway);
noBtn.addEventListener("touchstart", runAway);

yesBtn.addEventListener("click", ()=>{
  card.innerHTML = `
    <div class="final">
      <h1>💖</h1>
      <p>
        ${girlName},<br><br>
        tumhara YES mere liye sabse cute moment hai 😭✨<br><br>
        Ab toh yeh kahani shuru ho chuki hai 💫
      </p>
    </div>
  `;
});

/* ========= FLOATING EMOJIS ========= */
const emojis = ["💖","✨","💘","😍","💫"];
setInterval(()=>{
  const e = document.createElement("div");
  e.className="emoji";
  e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=4+Math.random()*4+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),8000);
},450);
</script>

</body>
</html>
