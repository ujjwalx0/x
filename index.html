<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You 💖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Poppins",system-ui;
  background:
    radial-gradient(circle at top left,#ff4f9a,transparent 40%),
    radial-gradient(circle at bottom right,#7b2cff,transparent 45%),
    #0b0b14;
  overflow:hidden;
  padding:16px;
}

.card{
  width:100%;
  max-width:420px;
  padding:34px 26px 38px;
  border-radius:32px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  box-shadow:0 40px 110px rgba(0,0,0,.55);
  color:#fff;
  text-align:center;
}

h1{
  margin:0 0 10px;
  font-size:36px;
  font-weight:700;
  background:linear-gradient(135deg,#ff9bd5,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{font-size:16.5px;line-height:1.6}

.hero-gif{
  width:100%;
  border-radius:18px;
  margin:14px 0 18px;
}

.question{
  font-size:21px;
  font-weight:600;
}

.subline{
  font-size:14.5px;
  opacity:.85;
  margin-bottom:22px;
  font-style:italic;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:16px 0;
  font-size:17px;
  border:none;
  border-radius:22px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,#ff3b7f,#ff92d0);
  color:#fff;
}

#no{
  background:rgba(255,255,255,.25);
  color:#fff;
  position:relative;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>

  <p id="intro"></p>

  <img class="hero-gif"
    src="https://media.giphy.com/media/xUPGcguWZHRC2HyBRS/giphy.gif"
    alt="romantic hug">

  <div class="question">
    Would you like to turn this moment into something meaningful?
  </div>

  <div class="subline">
    Some choices feel small, but change everything ✨
  </div>

  <div class="btns">
    <button id="yes">Yes 💖</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
/* ===== NAME FROM QUERY PARAM (CORRECT) ===== */
const params = new URLSearchParams(window.location.search);
const rawName = params.get("name") || "You";

const cleanName =
  rawName.charAt(0).toUpperCase() + rawName.slice(1).toLowerCase();

document.getElementById("name").innerText = cleanName;
document.getElementById("intro").innerHTML =
  `Hey ${cleanName},<br>this little page is made just for you 💖`;

/* ===== NO BUTTON RUNS ONLY WHEN CLOSE ===== */
const noBtn = document.getElementById("no");

function distance(a,b,c,d){
  return Math.hypot(a-c,b-d);
}

function checkProximity(x,y){
  const r = noBtn.getBoundingClientRect();
  const bx = r.left + r.width/2;
  const by = r.top + r.height/2;

  if(distance(x,y,bx,by) < 90){
    const nx = Math.random()*260 - 130;
    const ny = Math.random()*180 - 90;
    noBtn.style.transform = `translate(${nx}px,${ny}px)`;
  }
}

document.addEventListener("mousemove", e=>{
  checkProximity(e.clientX,e.clientY);
});

document.addEventListener("touchmove", e=>{
  const t = e.touches[0];
  checkProximity(t.clientX,t.clientY);
});

/* ===== YES CLICK ===== */
document.getElementById("yes").onclick = ()=>{
  document.getElementById("card").innerHTML = `
    <h1>🤗</h1>
    <p style="font-size:18px">
      ${cleanName},<br><br>
      this hug is just for you 💖<br>
      you made this moment special ✨
    </p>
    <img class="hero-gif"
      src="https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif">
  `;
};
</script>

</body>
</html>
