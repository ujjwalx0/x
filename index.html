<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Real Moment 💖</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ===== GLOBAL RESET ===== */
* { -webkit-tap-highlight-color: transparent }

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
  from { opacity:0; transform: translateY(12px) }
  to { opacity:1; transform:none }
}
@keyframes float {
  0%,100% { transform: translateY(0) }
  50% { transform: translateY(-14px) }
}
@keyframes glow {
  0%,100% { box-shadow:0 0 40px rgba(255,105,180,.35) }
  50% { box-shadow:0 0 80px rgba(255,105,180,.55) }
}
@keyframes heart {
  from { transform: scale(.4); opacity:1 }
  to { transform: scale(2); opacity:0 }
}

.fade { animation: fadeIn .6s ease forwards }
.float { animation: float 6s ease-in-out infinite }
.glow { animation: glow 5s ease-in-out infinite }

.heart {
  position: fixed;
  font-size: 26px;
  animation: heart 1s ease forwards;
  pointer-events:none;
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-100 to-white flex items-center justify-center overflow-hidden">

<!-- Ambient Lights -->
<div class="absolute -top-40 -left-40 w-[420px] h-[420px] bg-pink-300/40 rounded-full blur-3xl float"></div>
<div class="absolute -bottom-40 -right-40 w-[420px] h-[420px] bg-rose-200/50 rounded-full blur-3xl float"></div>

<!-- MAIN CONTAINER -->
<div id="app"
 class="relative z-10 w-full max-w-md mx-auto px-4">

  <!-- CARD -->
  <div id="card"
   class="bg-white/85 backdrop-blur-xl rounded-3xl p-7 text-center glow fade">
  </div>
</div>

<!-- MODAL -->
<div id="modal"
 class="fixed inset-0 hidden items-center justify-center bg-black/40 z-50 px-4">
  <div class="bg-white rounded-3xl p-6 w-full max-w-md text-center fade">
    <h2 class="text-2xl font-semibold text-pink-500">Just one last thing 💌</h2>

    <p class="mt-3 text-gray-600 text-sm leading-relaxed">
      No pressure 🌸<br>
      Just write what your heart wants to say.
    </p>

    <textarea id="reply"
      class="mt-4 w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-300 outline-none text-sm"
      placeholder="Type your feelings here… 💖"></textarea>

    <button id="save"
      class="mt-5 w-full py-3 rounded-xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-semibold shadow-md active:scale-95 transition">
      Save my words 💞
    </button>
  </div>
</div>

<script>
/* ===== NAME ===== */
const q=new URLSearchParams(location.search);
const name=(q.get("query")||"You")
  .replace(/^\w/,c=>c.toUpperCase());

/* ===== ELEMENTS ===== */
const card=document.getElementById("card");
const modal=document.getElementById("modal");

/* ===== RENDER START ===== */
function start(){
card.innerHTML=`
<h1 class="text-3xl font-semibold text-gray-800">${name} 🌸</h1>

<p class="mt-4 text-gray-700 text-lg leading-relaxed">
Some moments don’t ask loudly.<br>
They just feel right… quietly ✨
</p>

<p class="mt-6 text-xl font-medium text-gray-900">
If I asked you to choose this feeling with me 💖
</p>

<p class="mt-2 text-sm text-gray-600">
what would your heart say?
</p>

<div class="mt-7 flex justify-center gap-3">
<button id="yes"
 class="px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-400 to-rose-500 text-white text-sm font-semibold shadow-md active:scale-95">
Yes 💕
</button>

<button id="no"
 class="px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-xs">
No 🙈
</button>
</div>

<p class="mt-5 text-xs text-gray-500">
This moment is safe 🤍
</p>

<footer class="mt-6 text-[11px] text-gray-400">
Made with love — by Ujjwal
</footer>
`;

document.getElementById("yes").onclick=()=>{
burst();
modal.classList.remove("hidden");
modal.classList.add("flex");
};
}

/* ===== FINAL ===== */
function final(msg){
card.innerHTML=`
<h1 class="text-4xl">💖💖💖</h1>

<p class="mt-4 text-lg text-gray-800">
You said yes, ${name} 🥹<br>
And that means everything.
</p>

<blockquote class="mt-6 italic text-gray-700 border-l-4 border-pink-400 pl-4">
"${msg}"
</blockquote>

<img
 class="mt-8 rounded-2xl shadow-xl mx-auto"
 src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMTR2emF2MzdjOXB1YTNlYThzbmQ0eXd2N3k2eXRlY2c0aXkzY2p3diZlcD12MV9naWZzX3NlYXJjaCZjdD1n/QvBoMEcQ7DQXK/giphy.gif"
/>

<p class="mt-6 text-sm text-gray-500">
This moment stays forever 💞
</p>

<footer class="mt-6 text-[11px] text-gray-400">
Made with love — by Ujjwal
</footer>
`;
}

/* ===== SAVE ===== */
document.getElementById("save").onclick=()=>{
const msg=document.getElementById("reply").value.trim();
if(!msg) return;
modal.classList.add("hidden");
final(msg);
};

/* ===== HEARTS ===== */
function burst(){
for(let i=0;i<18;i++){
const h=document.createElement("div");
h.className="heart";
h.innerText="💖";
h.style.left=Math.random()*100+"vw";
h.style.top=Math.random()*100+"vh";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1000);
}
}

/* ===== NO RUN ===== */
document.addEventListener("mousemove",e=>run(e.clientX,e.clientY));
document.addEventListener("touchmove",e=>{
const t=e.touches[0]; run(t.clientX,t.clientY);
},{passive:true});

function run(x,y){
const no=document.getElementById("no");
if(!no) return;
const r=no.getBoundingClientRect();
if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<80){
no.style.transform=`translate(${Math.random()*180-90}px,${Math.random()*140-70}px)`;
}
}

/* ===== INIT ===== */
start();
</script>

</body>
</html>
