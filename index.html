<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine 💖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Poppins",system-ui;
  background:
    radial-gradient(circle at top left,#ff3d81,transparent 45%),
    radial-gradient(circle at bottom right,#6a00ff,transparent 45%),
    #0a0a14;
  overflow:hidden;
  padding:16px;
}

.card{
  width:100%;
  max-width:420px;
  padding:36px 26px 40px;
  border-radius:32px;
  background:rgba(255,255,255,0.14);
  backdrop-filter:blur(22px);
  box-shadow:0 45px 120px rgba(0,0,0,.6);
  color:#fff;
  text-align:center;
  animation:pop .7s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  margin:0 0 12px;
  font-size:38px;
  font-weight:700;
  background:linear-gradient(135deg,#ff9bd5,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16.8px;
  line-height:1.7;
  opacity:.96;
}

.hero-gif{
  width:100%;
  border-radius:20px;
  margin:16px 0 20px;
}

.question{
  margin:18px 0 8px;
  font-size:22px;
  font-weight:600;
}

.subline{
  font-size:15px;
  opacity:.88;
  margin-bottom:24px;
  font-style:italic;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:17px 0;
  font-size:17px;
  border:none;
  border-radius:24px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,#ff2f7d,#ff8fd1);
  color:#fff;
  box-shadow:0 18px 45px rgba(255,47,125,.6);
}

#no{
  background:rgba(255,255,255,.25);
  color:#fff;
  position:relative;
}

/* emojis */
.emoji{
  position:absolute;
  font-size:22px;
  animation:float 6s linear infinite;
  pointer-events:none;
}

@keyframes float{
  from{transform:translateY(110vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}

.final h1{font-size:46px}
.final p{font-size:18px}

.gif{
  width:100%;
  border-radius:20px;
  margin-top:22px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>

  <p id="intro"></p>

  <!-- PROPOSAL GIF -->
  <img class="hero-gif"
    src="https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif"
    alt="proposal">

  <div class="question">
    Will you be mine, today and forever? 💍
  </div>

  <div class="subline">
    Not just for Valentine’s Day… but for every ordinary & extraordinary moment ❤️
  </div>

  <div class="btns">
    <button id="yes">Yes 🤍</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
/* ===== NAME FROM QUERY PARAM ===== */
const params = new URLSearchParams(window.location.search);
const rawName = params.get("name") || "You";

const cleanName =
  rawName.charAt(0).toUpperCase() + rawName.slice(1).toLowerCase();

document.getElementById("name").innerText = cleanName + " 💖";
document.getElementById("intro").innerHTML =
  `Hey ${cleanName},<br>
   there’s something I’ve been wanting to ask you for a long time…`;

/* ===== NO BUTTON (PROXIMITY BASED) ===== */
const noBtn = document.getElementById("no");

function dist(x1,y1,x2,y2){
  return Math.hypot(x1-x2,y1-y2);
}

function checkNear(x,y){
  const r=noBtn.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  if(dist(x,y,cx,cy)<90){
    const nx=Math.random()*260-130;
    const ny=Math.random()*180-90;
    noBtn.style.transform=`translate(${nx}px,${ny}px)`;
  }
}

document.addEventListener("mousemove",e=>{
  checkNear(e.clientX,e.clientY);
});
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  checkNear(t.clientX,t.clientY);
});

/* ===== YES CLICK (HUG MOMENT) ===== */
document.getElementById("yes").onclick=()=>{
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>🤗</h1>
      <p>
        ${cleanName},<br><br>
        come here… this hug is for you 🤍<br>
        you just turned a simple moment into something unforgettable ✨<br><br>
        Happy Valentine’s — not just today, but always 💫
      </p>

      <img class="gif"
        src="https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif"
        alt="hug">
    </div>
  `;
};

/* ===== FLOATING EMOJIS ===== */
const emojis=["🤍","💖","✨","💫","🌸"];
setInterval(()=>{
  const e=document.createElement("div");
  e.className="emoji";
  e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=3+Math.random()*3+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),7000);
},360);
</script>

</body>
</html>
