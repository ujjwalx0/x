<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Question</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,"Poppins";
  background:
    radial-gradient(60% 60% at 15% 10%, #ff4d9d55, transparent),
    radial-gradient(50% 50% at 85% 90%, #7b4dff55, transparent),
    #06060c;
  color:#fff;
  overflow:hidden;
  padding:16px;
}

.card{
  width:100%;
  max-width:420px;
  padding:38px 26px 42px;
  border-radius:36px;
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(28px);
  box-shadow:0 50px 150px rgba(0,0,0,.65);
  text-align:center;
  animation:enter .8s ease;
}

@keyframes enter{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 12px;
  font-size:34px;
  font-weight:700;
  background:linear-gradient(135deg,#ffd6eb,#ffffff);
  -webkit-background-clip:text;
  color:transparent;
}

p{
  font-size:16.5px;
  line-height:1.7;
  opacity:.95;
}

.hero{
  width:100%;
  border-radius:22px;
  margin:18px 0 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.question{
  font-size:21px;
  font-weight:600;
  margin:16px 0 10px;
}

.sub{
  font-size:14.5px;
  opacity:.8;
  margin-bottom:26px;
}

.btns{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:17px 0;
  font-size:16.8px;
  border:none;
  border-radius:28px;
  cursor:pointer;
}

#yes{
  background:linear-gradient(135deg,#ff2f7d,#ff8fd1);
  color:#fff;
  box-shadow:0 18px 55px rgba(255,47,125,.55);
}

#no{
  background:rgba(255,255,255,.22);
  color:#fff;
  position:relative;
}

.final h1{font-size:42px}
.final p{font-size:18px}

.gif{
  width:100%;
  border-radius:24px;
  margin-top:26px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="name"></h1>
  <p id="intro"></p>

  <!-- PROPOSAL GIF (ONLY PROPOSAL PHASE) -->
  <img class="hero" id="heroGif" alt="moment">

  <div class="question">
    Do you choose me — not just for now, but for what comes next?
  </div>

  <div class="sub">
    Yes means you want me in your life.  
    No means you don’t feel the same.
  </div>

  <div class="btns">
    <button id="yes">Yes, I choose you</button>
    <button id="no">No</button>
  </div>
</div>

<script>
/* ========= NAME ========= */
const params=new URLSearchParams(location.search);
const raw=params.get("name")||"You";
const name=raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();

document.getElementById("name").innerText=name;
document.getElementById("intro").innerHTML=
  `Hey ${name},<br>
   this isn’t noise. This is intention.`;

/* ========= PHASE ========= */
let phase="proposal";

/* ========= GIF LISTS ========= */

/* ONLY PROPOSAL / ASKING */
const proposalGifs=[
  "https://media.giphy.com/media/xUPGcguWZHRC2HyBRS/giphy.gif",
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
  "https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif",
  "https://media.giphy.com/media/3oriO6qJiXajN0TyDu/giphy.gif",
  "https://media.giphy.com/media/26BRrSvJUa0crqw4E/giphy.gif"
];

/* ONLY HUG / LOVE (AFTER YES) */
const hugGifs=[
  "https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif",
  "https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif",
  "https://media.giphy.com/media/HaC1WdpkL3W00/giphy.gif",
  "https://media.giphy.com/media/gnXG2hODaCOru/giphy.gif",
  "https://media.giphy.com/media/12hvLuZ7uzvCvK/giphy.gif"
];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* load proposal gif */
const hero=document.getElementById("heroGif");
hero.src=pick(proposalGifs);

/* ========= NO BUTTON (REAL PROXIMITY) ========= */
const no=document.getElementById("no");

function near(x,y){
  const r=no.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  return Math.hypot(x-cx,y-cy)<80;
}

function run(){
  no.style.transform=`translate(${Math.random()*240-120}px,${Math.random()*160-80}px)`;
}

document.addEventListener("mousemove",e=>{
  if(near(e.clientX,e.clientY))run();
});
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(near(t.clientX,t.clientY))run();
});

/* ========= YES CLICK ========= */
document.getElementById("yes").onclick=()=>{
  phase="accepted";
  document.getElementById("card").innerHTML=`
    <div class="final">
      <h1>🤍</h1>
      <p>
        ${name},<br><br>
        then stay.<br>
        this isn’t loud — it’s real.<br><br>
        I’m here.
      </p>
      <img class="gif" src="${pick(hugGifs)}">
    </div>
  `;
};
</script>

</body>
</html>
